<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Estoque simples</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: #f1f5f9; color: #172033; font: 16px Arial, sans-serif; }
        main { width: min(100%, 380px); padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 8px 30px #17203315; }
        h1 { margin-top: 0; }
        label { display: block; margin: 1rem 0 .4rem; }
        input, button { width: 100%; padding: .75rem; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
        button { margin-top: 1.25rem; border: 0; background: #2563eb; color: white; cursor: pointer; }
        .erro { padding: .75rem; border-radius: 6px; background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
<main>
    <h1>Estoque simples</h1>
    <p>Entre para gerenciar produtos e movimentações.</p>
    {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
    <form action="{{ url_for('auth.realizar_login') }}" method="post">
        <label for="login">Login</label>
        <input type="text" id="login" name="login" autocomplete="username" required autofocus>
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
    </form>
</main>
</body>
</html>
